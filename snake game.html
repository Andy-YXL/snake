<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset = "UTF-8">
    <title>貪食蛇</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #222;
        }
    canvas {
        background: #111;
        border: 2px solid #555;
    }    
    </style>
</head>
<body>
    <canvas id="game" width="400" height="400"></canvas>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        const GRID = 20;                       //一格20像素
        const COLS = canvas.width / GRID;      //橫向20格 
        const ROWS = canvas.height / GRID;     //縱向20格 

        //劃一格方塊:傳入「格子座標」和顏色
        function drawCell(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x*GRID, y*GRID, GRID - 1, GRID - 1);
        }

        let snake = [
            { x: 7, y: 5 },
            { x: 6, y: 5 }, 
            { x: 5, y: 5 },
        ];

        let dir = {x: 1 , y: 0};   // 目前方向 預設為右

        function randomCell(){
            return{
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS),
            };
        }

        let score = 0;
        let gameOver = false;

        let food = randomCell();

        function update() {
            if (gameOver) return;

            const head = snake[0];
            const newHead = { x: head.x + dir.x, y: head.y + dir.y };

            //撞牆
            if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
                gameOver = true;
                return;
            }

            //撞到自身
            if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
                gameOver = true;
                return;
            }
            
            snake.unshift(newHead);  // 新的頭接到最前面

            if (newHead.x === food.x && newHead.y === food.y) {
                food = randomCell();   // 吃到食物，生出新食物，且不將尾巴消除
                score = score +1;
            } else {
                snake.pop();           // 砍掉尾巴
            }
              
        }


        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);  // 清掉上一幀
            drawCell(food.x, food.y, '#ef4444');

            snake.forEach((seg, i) => {
                const color = i === 0 ? '#86efac' : '#4ade80';
                drawCell(seg.x, seg.y, color);
            });

            ctx.fillStyle = '#fff';
            ctx.font = '16px sans-serif';
            ctx.fillText('分數:'+score ,10 , 24);

            if (gameOver) {
                ctx.fillStyle = 'rgba(0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#fff';
                ctx.font = '28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('遊戲結束',canvas.width/2, canvas.height / 2 - 10);
                ctx.font = '16px sans-serif';
                ctx.fillText('按 R 重新開始', canvas.width / 2, canvas.height / 2 +24);
                ctx.textAlign = 'left';
            }

        }

        function reset () {
            snake = [{ x: 7, y: 5},{ x: 6, y: 5},{ x: 5, y: 5}];
            dir = { x: 1, y: 0 };
            food = randomCell();
            score = 0;
            gameOver = false;
        }
        
        function tick() {
            update();
            draw();
        }

        const KEY_TO_DIR = {
        arrowup:    { x: 0,  y: -1 },
        arrowdown:  { x: 0,  y: 1  },
        arrowleft:  { x: -1, y: 0  },
        arrowright: { x: 1,  y: 0  },
        w: { x: 0,  y: -1 },
        s: { x: 0,  y: 1  },
        a: { x: -1, y: 0  },
        d: { x: 1,  y: 0  },
        };


        document.addEventListener('keydown', function(e) {
            const key = e.key.toLowerCase();
            if (key === 'r') reset();
            const next = KEY_TO_DIR[e.key.toLowerCase()];
            if(!next) return;
            if (next.x === -dir.x && next.y === -dir.y) return;
                       
        });


        setInterval(tick, 150);    //每 150 毫秒執行一次tick





    </script>
</body>
</html>
